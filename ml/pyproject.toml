[project]
name = "lv-ml"
version = "0.1.0"
description = "PRAMANA ML layer: detectors, calibration, fingerprints, evidence builder"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "torch>=2.3",
  "open-clip-torch>=2.26",
  "scikit-learn>=1.5",
  "onnx>=1.16",
  "onnxruntime>=1.18",
  "Pillow>=10.3",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pydantic>=2.7",
  "jsonschema>=4.22",
  "trustmark>=0.3",
  "datasets>=2.20",
  "huggingface-hub>=0.24",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "ANN", "S", "B", "C4", "T20"]


[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T201", "INP001"]
"tests/*" = ["S101", "ANN"]


[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["scipy.*", "open_clip.*", "datasets.*", "huggingface_hub.*"]
ignore_missing_imports = true


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
