[project]
name = "lv-ml"
version = "0.1.0"
description = "PRAMAN ML layer: detectors, calibration, fingerprints, evidence builder"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "torch>=2.3",
  "open-clip-torch>=2.26",
  "scikit-learn>=1.5",
  "onnx>=1.16",
  "onnxruntime>=1.18",
  "onnxscript",
  "Pillow>=10.3",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pydantic>=2.7",
  "jsonschema>=4.22",
  "trustmark>=0.3",
  "datasets>=2.20",
  "huggingface-hub>=0.24",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "ANN", "S", "B", "C4", "T20"]


[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T201", "INP001", "S310", "S311", "E501", "S101", "S607", "F841", "B905"]
"tests/*" = ["S101", "ANN"]
"src/lv_ml/eval/*" = ["T201", "S311", "E501", "B905", "N803", "N806", "ANN401", "B007"]



[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = false
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "scipy",
    "open_clip.*",
    "open_clip",
    "datasets.*",
    "datasets",
    "huggingface_hub.*",
    "huggingface_hub",
    "onnxruntime.*",
    "onnxruntime",
    "jsonschema.*",
    "jsonschema",
    "sklearn.*",
    "sklearn",
    "pandas.*",
    "pandas",
    "trustmark.*",
    "trustmark",
]
ignore_missing_imports = true


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
